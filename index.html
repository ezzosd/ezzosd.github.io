<style>
:root {
  --bg: #0a0b0f;
  --surface: #15171d;
  --surface-2: #1a1d24;
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(212,160,23,0.25);
  --text: #f5f3ee;
  --text-dim: #a8a5a0;
  --text-muted: #6b6a67;
  --gold: #d4a017;
  --gold-2: #f5d76e;
  --gold-3: #b8860b;
  --silver: #c0c5ce;
  --silver-2: #e2e6ee;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Tajawal', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse at top right, rgba(212,160,23,0.08), transparent 60%),
    radial-gradient(ellipse at bottom left, rgba(184,134,11,0.05), transparent 60%);
  background-attachment: fixed;
}
.container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

/* ===== Top Bar ===== */
.top-bar {
  border-bottom: 1px solid var(--border);
  padding: 18px 0;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,11,15,0.85);
}
.top-bar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--text); }
.brand-logo { width: 48px; height: 48px; flex-shrink: 0; }
.brand-name { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
.brand-name span {
  background: linear-gradient(135deg, var(--gold-2), var(--gold-3));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand-tag {
  font-size: 10px; color: var(--text-muted);
  letter-spacing: 2.5px; text-transform: uppercase;
  margin-top: 4px;
}
.status {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 100px;
  background: var(--surface); border: 1px solid var(--border);
  font-size: 12px; color: var(--text-dim);
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 8px #10b981;
  animation: pulse 2s infinite;
}
.status-dot.offline { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ===== Hero ===== */
.hero {
  padding: 72px 0 48px;
  text-align: center;
  position: relative;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(212,160,23,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,160,23,0.04) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  pointer-events: none;
}
.eyebrow {
  display: inline-block;
  font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
  color: var(--gold); font-weight: 500; margin-bottom: 18px;
  padding: 6px 16px; border: 1px solid var(--border-strong);
  border-radius: 100px;
  background: rgba(212,160,23,0.05);
}
.hero h1 {
  font-size: clamp(32px, 5vw, 54px);
  font-weight: 900;
  line-height: 1.15;
  letter-spacing: -1px;
  margin-bottom: 14px;
  position: relative;
}
.hero h1 .accent {
  font-family: 'Amiri', serif;
  font-style: italic;
  font-weight: 700;
  background: linear-gradient(135deg, var(--gold-2) 0%, var(--gold) 50%, var(--gold-3) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  padding: 0 6px;
}
.hero p {
  color: var(--text-dim);
  max-width: 580px; margin: 0 auto;
  font-size: 15px; position: relative;
}
.rate-badge {
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 18px; padding: 8px 18px;
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 100px; font-size: 13px; color: var(--text-dim);
  position: relative;
}
.rate-badge strong { color: var(--gold-2); font-weight: 700; }

/* ===== Country Section ===== */
.country-section { margin: 60px 0; }
.country-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 22px; padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap; gap: 8px;
}
.country-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.country-title .flag { margin-left: 10px; font-size: 20px; }
.country-meta {
  font-size: 12px; color: var(--text-muted);
  letter-spacing: 1px; text-transform: uppercase;
}
.country-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
@media (max-width: 768px) {
  .country-grid { grid-template-columns: 1fr; }
}

/* ===== Card ===== */
.card {
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
.card::before {
  content: ''; position: absolute; top: 0; right: 0; left: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
}
.card-header {
  padding: 14px 20px;
  background: rgba(0,0,0,0.2);
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  font-weight: 700;
  color: var(--text-dim);
  display: flex; align-items: center; gap: 8px;
}
.card-header .dot { width: 6px; height: 6px; border-radius: 50%; }
.card-header .dot.gold { background: var(--gold); }
.card-header .dot.blue { background: #60a5fa; }
.overflow { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: right;
  padding: 12px 18px;
  font-size: 10px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  background: rgba(0,0,0,0.1);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody td {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background 0.15s; }
tbody tr:hover { background: rgba(212,160,23,0.03); }
.label-cell { color: var(--text-dim); font-weight: 500; }
.value-cell {
  font-weight: 700;
  font-size: 16px;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.value-cell.gold { color: var(--gold-2); }
.value-cell.inverted { color: #34d399; }
.code-badge {
  display: inline-block;
  padding: 3px 8px; border-radius: 5px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  font-family: ui-monospace, 'Menlo', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--text-dim);
}

/* ===== Note ===== */
.note {
  padding: 10px 20px;
  background: rgba(212,160,23,0.04);
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  display: flex; align-items: flex-start; gap: 8px;
  line-height: 1.7;
}
.note .ico { color: var(--gold); flex-shrink: 0; margin-top: 2px; }

/* ===== Footer ===== */
footer {
  border-top: 1px solid var(--border);
  padding: 36px 0 48px;
  margin-top: 72px;
  text-align: center;
}
footer .brand-logo {
  width: 34px; height: 34px;
  margin: 0 auto 14px; display: block; opacity: 0.55;
}
footer p { font-size: 12px; color: var(--text-muted); letter-spacing: 0.5px; }

/* ===== Responsive ===== */
@media (max-width: 640px) {
  .container { padding: 0 16px; }
  .hero { padding: 44px 0 28px; }
  .hero h1 { font-size: 32px; }
  .country-title { font-size: 20px; }
  thead th, tbody td { padding: 10px 12px; font-size: 12px; }
  .value-cell { font-size: 14px; }
  .brand-name { font-size: 20px; }
  .brand-logo { width: 40px; height: 40px; }
  .top-bar { padding: 14px 0; }
  .brand-tag { display: none; }
}
</style>
</head>

<script>
  /* ═══════════════════════════════════════════════════════════════
     ⚙️ الإعدادات
     ═══════════════════════════════════════════════════════════════ */

  // ✏️ سعر الدولار مقابل الجنيه السوداني (السوق الموازي)
  // يُستخدم لحساب أسعار الذهب والعملات في السودان
  // ⚠️ حدّث هذا الرقم دورياً ليطابق السوق الفعلي
  const SDG_MANUAL_RATE = 10000;

  // APIs (مجانية، بدون مفتاح)
  const ALQANAAS_API = 'https://alqanaas.com/gold-data.json';
  const CURRENCY_API = 'https://open.er-api.com/v6/latest/USD';

  // الدول المطلوبة
  const COUNTRIES = [
    { code: 'EG', name: 'مصر', flag: '🇪🇬', currency: 'EGP' },
    { code: 'SD', name: 'السودان', flag: '🇸🇩', currency: 'SDG' },
    { code: 'SA', name: 'السعودية', flag: '🇸🇦', currency: 'SAR' },
    { code: 'AE', name: 'الإمارات', flag: '🇦🇪', currency: 'AED' },
    { code: 'BH', name: 'البحرين', flag: '🇧🇭', currency: 'BHD' },
    { code: 'IQ', name: 'العراق', flag: '🇮🇶', currency: 'IQD' },
    { code: 'KW', name: 'الكويت', flag: '🇰🇼', currency: 'KWD' },
    { code: 'QA', name: 'قطر', flag: '🇶🇦', currency: 'QAR' },
    { code: 'OM', name: 'عُمان', flag: '🇴🇲', currency: 'OMR' },
    { code: 'JO', name: 'الأردن', flag: '🇯🇴', currency: 'JOD' }
  ];

  const TARGET_CURRENCIES = ['USD', 'EUR', 'GBP', 'SAR', 'AED'];
  const CURRENCY_NAMES = {
    USD: 'الدولار الأمريكي', EUR: 'اليورو', GBP: 'الجنيه الإسترليني',
    SAR: 'الريال السعودي', AED: 'الدرهم الإماراتي'
  };
  const CURRENCY_SYMBOLS = {
    EGP: 'ج.م', SDG: 'ج.س', SAR: 'ر.س', AED: 'د.إ', BHD: 'د.ب',
    IQD: 'ع.د', KWD: 'د.ك', QAR: 'ر.ق', OMR: 'ر.ع', JOD: 'د.أ'
  };

  const OZ_TO_GRAM = 31.1034768;

  /* ═══════════════════════════════════════════════════════════════
     دوال مساعدة
     ═══════════════════════════════════════════════════════════════ */

  function fmt(v, d) {
    d = (d === undefined) ? 2 : d;
    if (!isFinite(v)) return '-';
    return new Intl.NumberFormat('ar-EG-u-nu-latn', {
      minimumFractionDigits: d, maximumFractionDigits: d
    }).format(v);
  }

  function setStatus(live) {
    document.getElementById('statusDot').classList.toggle('offline', !live);
  }

  function updateTimestamp() {
    var now = new Date();
    document.getElementById('lastUpdated').textContent = new Intl.DateTimeFormat('ar-EG-u-nu-latn', {
      dateStyle: 'medium', timeStyle: 'short'
    }).format(now);
    document.getElementById('year').textContent = now.getFullYear();
  }

  /* ═══════════════════════════════════════════════════════════════
     عرض بيانات دولة
     ═══════════════════════════════════════════════════════════════ */

  function renderCountry(country, goldPrices, currencyRates) {
    var sym = CURRENCY_SYMBOLS[country.currency] || country.currency;
    var section = document.createElement('section');
    section.className = 'country-section';

    var goldRows = '';
    if (goldPrices) {
      goldRows =
        '<tr><td class="label-cell">عيار 24</td><td class="value-cell gold">' + fmt(goldPrices.k24, 0) + ' ' + sym + '</td></tr>' +
        '<tr><td class="label-cell">عيار 22</td><td class="value-cell gold">' + fmt(goldPrices.k22, 0) + ' ' + sym + '</td></tr>' +
        '<tr><td class="label-cell">عيار 21</td><td class="value-cell gold">' + fmt(goldPrices.k21, 0) + ' ' + sym + '</td></tr>' +
        '<tr><td class="label-cell">عيار 18</td><td class="value-cell gold">' + fmt(goldPrices.k18, 0) + ' ' + sym + '</td></tr>';
    } else {
      goldRows = '<tr><td colspan="2" style="text-align:center;color:var(--text-muted);padding:20px;">لا تتوفر بيانات الذهب</td></tr>';
    }

    var currencyRows = '';
    if (currencyRates && Object.keys(currencyRates).length > 0) {
      currencyRows = TARGET_CURRENCIES
        .filter(function(code) { return currencyRates[code] != null && currencyRates[code] > 0; })
        .map(function(code) {
          return '<tr>' +
            '<td><div style="font-weight:500">' + (CURRENCY_NAMES[code] || code) + '</div></td>' +
            '<td><span class="code-badge">' + code + '</span></td>' +
            '<td class="value-cell inverted">' + fmt(currencyRates[code], 2) + ' ' + sym + '</td>' +
          '</tr>';
        }).join('');
    } else {
      currencyRows = '<tr><td colspan="3" style="text-align:center;color:var(--text-muted);padding:20px;">لا تتوفر بيانات العملات</td></tr>';
    }

    section.innerHTML =
      '<div class="country-head">' +
        '<h2 class="country-title"><span class="flag">' + country.flag + '</span>' + country.name + '</h2>' +
        '<span class="country-meta">' + country.currency + ' · أسعار محلية</span>' +
      '</div>' +
      '<div class="country-grid">' +
        '<div class="card">' +
          '<div class="card-header"><span class="dot gold"></span> الذهب (لكل جرام)</div>' +
          '<div class="overflow"><table><thead><tr><th>العيار</th><th>السعر</th></tr></thead><tbody>' + goldRows + '</tbody></table></div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-header"><span class="dot blue"></span> العملات مقابل ' + sym + '</div>' +
          '<div class="overflow"><table><thead><tr><th>العملة</th><th>الكود</th><th>1 وحدة = ؟</th></tr></thead><tbody>' + currencyRows + '</tbody></table></div>' +
        '</div>' +
      '</div>';

    document.getElementById('countriesContainer').appendChild(section);
  }

  /* ═══════════════════════════════════════════════════════════════
     التحميل الرئيسي
     ═══════════════════════════════════════════════════════════════ */

  async function loadAll() {
    updateTimestamp();
    setStatus(false);
    var container = document.getElementById('countriesContainer');
    container.innerHTML = '<p style="text-align:center; padding:60px 0; color:var(--text-muted);">جاري تحميل البيانات...</p>';

    try {
      // 1. جلب بيانات الذهب + بيانات العملات
      var [goldResponse, currencyResponse] = await Promise.all([
        fetch(ALQANAAS_API, { cache: 'no-store' }),
        fetch(CURRENCY_API, { cache: 'no-store' })
      ]);

      if (!goldResponse.ok) throw new Error('AlQANAAS status ' + goldResponse.status);
      if (!currencyResponse.ok) throw new Error('Currency status ' + currencyResponse.status);

      var goldData = await goldResponse.json();
      var currencyData = await currencyResponse.json();

      // سعر الذهب العالمي (لكل أونصة)
      var liveXau = goldData.liveXauusd;
      var goldUsdOz = liveXau ? Number(liveXau.mid || liveXau.ask || 0) : 0;
      if (!isFinite(goldUsdOz) || goldUsdOz <= 0) throw new Error('Invalid XAUUSD price');

      // تحديث الشارة: سعر الذهب العالمي
      document.getElementById('rateUsed').textContent = '$' + fmt(goldUsdOz, 2) + ' / أونصة';

      var ratesToUsd = currencyData.rates;
      if (!ratesToUsd) throw new Error('Invalid currency rates');

      container.innerHTML = '';

      // 2. لكل دولة
      COUNTRIES.forEach(function(country) {
        var goldPrices = null;
        var currencyRates = {};

        // --- الذهب ---
        if (country.code === 'SD') {
          // السودان: حساب من السعر العالمي × سعر الدولار اليدوي
          var goldSdgGram = (goldUsdOz * SDG_MANUAL_RATE) / OZ_TO_GRAM;
          goldPrices = {
            k24: goldSdgGram,
            k22: goldSdgGram * 22 / 24,
            k21: goldSdgGram * 21 / 24,
            k18: goldSdgGram * 18 / 24
          };
        } else {
          var alqCountry = goldData.countries ? goldData.countries.find(function(c) {
            return (c.countryCode || '').toUpperCase() === country.code;
          }) : null;

          if (alqCountry && alqCountry.goldPerGram) {
            var g = alqCountry.goldPerGram;
            goldPrices = {
              k24: g['24K'] || g.karat24 || g['24k'],
              k22: g['22K'] || g.karat22 || g['22k'],
              k21: g['21K'] || g.karat21 || g['21k'],
              k18: g['18K'] || g.karat18 || g['18k']
            };
          } else {
            var officialRate = ratesToUsd[country.currency];
            if (officialRate && officialRate > 0) {
              var goldLocalGram = (goldUsdOz * officialRate) / OZ_TO_GRAM;
              goldPrices = {
                k24: goldLocalGram,
                k22: goldLocalGram * 22 / 24,
                k21: goldLocalGram * 21 / 24,
                k18: goldLocalGram * 18 / 24
              };
            }
          }
        }

        // --- العملات ---
        var localPerUsd = ratesToUsd[country.currency];
        if (localPerUsd && localPerUsd > 0) {
          TARGET_CURRENCIES.forEach(function(code) {
            var foreignPerUsd = ratesToUsd[code];
            if (foreignPerUsd && foreignPerUsd > 0) {
              currencyRates[code] = localPerUsd / foreignPerUsd;
            }
          });
        }

        // للسودان: تعديل أسعار العملات لتتوافق مع السعر اليدوي (بدلاً من السعر الرسمي)
        if (country.code === 'SD' && localPerUsd) {
          var officialSdgPerUsd = ratesToUsd.SDG;
          if (officialSdgPerUsd && officialSdgPerUsd > 0) {
            var adjustment = SDG_MANUAL_RATE / officialSdgPerUsd;
            Object.keys(currencyRates).forEach(function(code) {
              currencyRates[code] *= adjustment;
            });
          }
        }

        renderCountry(country, goldPrices, currencyRates);
      });

      setStatus(true);
      console.log('✅ All countries loaded. Global XAU/USD:', goldUsdOz, '| SDG manual rate:', SDG_MANUAL_RATE);

    } catch (err) {
      console.error('❌ Load failed:', err);
      container.innerHTML =
        '<div style="text-align:center; padding:60px 20px;">' +
          '<p style="color:var(--text-muted); margin-bottom:20px;">⚠️ تعذر تحميل البيانات. تحقق من اتصالك بالإنترنت.</p>' +
          '<button onclick="loadAll()" style="background:var(--gold); color:var(--bg); border:none; padding:12px 30px; border-radius:100px; font-family:inherit; font-weight:700; cursor:pointer;">إعادة المحاولة</button>' +
        '</div>';
      setStatus(false);
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     التشغيل
     ═══════════════════════════════════════════════════════════════ */

  loadAll();
  setInterval(loadAll, 5 * 60 * 1000);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function(err) {
      console.warn('SW registration failed:', err);
    });
  }
</script>
