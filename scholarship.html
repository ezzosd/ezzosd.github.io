<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:type" content="article">

  <meta property="og:url" content="https://teachgrant.tech/scholarship.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Cairo,Arial,sans-serif;background:#f3f6fb;color:#172b43;line-height:1.9}
    a{color:inherit;text-decoration:none}.top{background:#102b46;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:16px}
    .brand{font-size:1.35rem;font-weight:900;color:#f0c36b}.top a:last-child{background:#d9a441;color:#172b43;padding:8px 16px;border-radius:10px;font-weight:800}
    main{width:min(900px,92%);margin:38px auto}.crumb{color:#64748b;font-size:.92rem;margin-bottom:18px}
    article{background:#fff;border:1px solid #e3eaf3;border-radius:20px;padding:clamp(22px,5vw,48px);box-shadow:0 12px 34px rgba(16,43,70,.07)}
    .tag{display:inline-block;background:#e7f7ef;color:#08784f;padding:5px 14px;border-radius:30px;font-size:.85rem;font-weight:800}
    h1{font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.5;margin:14px 0;color:#102b46}
    .org{color:#64748b;font-weight:700;margin-bottom:24px}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:22px 0}
    .fact{background:#f5f8fc;border:1px solid #e3eaf3;padding:14px;border-radius:12px}.fact b{display:block;color:#64748b;font-size:.83rem}.fact span{font-weight:800}
    h2{font-size:1.2rem;color:#102b46;margin:28px 0 10px}.copy{white-space:pre-wrap;overflow-wrap:anywhere}
    .apply{display:block;text-align:center;background:#0f9f75;color:#fff;padding:14px 20px;border-radius:12px;font-weight:900;margin-top:28px}
    .related{margin-top:30px;padding-top:18px;border-top:1px solid #e3eaf3}.related h2{margin-top:0}.related-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.related-item{display:block;background:#f5f8fc;border:1px solid #e3eaf3;border-radius:12px;padding:14px}.related-item strong{display:block;color:#102b46;line-height:1.6}.related-item span{display:block;color:#64748b;font-size:.85rem;margin-top:5px}
    .muted{color:#64748b;text-align:center;padding:45px 10px}footer{text-align:center;color:#64748b;padding:20px;font-size:.9rem}
  </style>

<style>
.tg-page-ad{direction:rtl;text-align:center;margin:24px auto;padding:12px 10px;border:1px solid #e7edf3;border-radius:14px;background:#f8fafc;max-width:100%;overflow:hidden}.tg-page-ad-label{display:block;color:#8492a1;font-size:11px;margin-bottom:8px}.tg-page-ad-slot{width:300px;max-width:100%;min-height:250px;margin:0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden}.tg-page-ad-slot iframe{max-width:100%}
</style>
</head>
<body>
  <header class="top"><a class="brand" href="/">TeachGrant</a><a href="/#scholarships">جميع المنح</a></header>
  <main>
    <div class="crumb"><a href="/">الرئيسية</a> / <a href="/#scholarships">المنح الدراسية</a> / التفاصيل</div>
    <article id="content"><div class="muted">جاري تحميل تفاصيل المنحة...</div></article>
  </main>
  <footer>TeachGrant — فرص تعليمية ومنح دراسية حول العالم</footer>
<script>
(function(){
 const SUPABASE_URL='https://dutpuwqybdzhjbiwrvcc.supabase.co';
 const SUPABASE_ANON_KEY='sb_publishable_oB9EVKpBUfRJMKMtF60D4Q_cDFKwtFk';
 const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 const root=document.getElementById('content');
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const safeUrl=v=>{try{const u=new URL(String(v||''));return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return ''}};
 function addJsonLd(value){const node=document.createElement('script');node.type='application/ld+json';node.textContent=JSON.stringify(value);document.head.appendChild(node)}
 function addBreadcrumbs(title,url){addJsonLd({'@context':'https://schema.org','@type':'BreadcrumbList','itemListElement':[
  {'@type':'ListItem','position':1,'name':'الرئيسية','item':'https://teachgrant.tech/'},
  {'@type':'ListItem','position':2,'name':'المنح الدراسية','item':'https://teachgrant.tech/#scholarships'},
  {'@type':'ListItem','position':3,'name':title,'item':url}
 ]})}
 function loadRelatedScholarships(currentId){
  client.from('scholarships').select('id,title,company,country,location,funding,created_at').neq('id',currentId).order('created_at',{ascending:false}).limit(3).then(({data,error})=>{
   if(error||!data?.length)return;
   const html=data.map(item=>'<a class="related-item" href="/scholarship.html?id='+encodeURIComponent(item.id)+'"><strong>'+esc(item.title||'منحة دراسية')+'</strong><span>'+esc(item.company||'الجهة المانحة')+' · '+esc(item.country||item.location||'')+'</span></a>').join('');
   root.insertAdjacentHTML('beforeend','<section class="related" aria-label="منح أخرى"><h2>منح أخرى قد تهمك</h2><div class="related-list">'+html+'</div></section>');
  });
 }
  const params=new URLSearchParams(window.location.search);
  const rawId=params.get('id');
  const id=Number(rawId);
  if(!rawId || !Number.isFinite(id) || id<=0){
    root.innerHTML='<div class="muted"><strong>تعذر قراءة رقم المنحة من الرابط.</strong><br>الرابط الذي وصل للصفحة: <code>'+esc(window.location.href)+'</code><br>بيانات الاستعلام: <code>'+esc(window.location.search||'(فارغ)')+'</code><br>القيمة المستخرجة للرقم: <code>'+esc(rawId??'(غير موجود)')+'</code><br><a href="/#scholarships">العودة إلى قائمة المنح</a></div>';
    return;
  }
 client.from('scholarships').select('*').eq('id',id).maybeSingle().then(({data,error})=>{
   if(error){
     console.error('TeachGrant scholarship query failed:',error);
     root.innerHTML='<div class="muted"><strong>تعذر تحميل بيانات المنحة.</strong><br>رمز الخطأ: '+esc(error.code||'غير معروف')+'<br>التفاصيل: '+esc(error.message||'لم تصل تفاصيل الخطأ')+'<br><a href="/#scholarships">العودة إلى قائمة المنح</a></div>';
     return;
   }
   if(!data){
     root.innerHTML='<div class="muted">لم يتم العثور على منحة بهذا الرقم ('+esc(id)+'). <a href="/#scholarships">العودة إلى قائمة المنح</a></div>';
     return;
   }
   const s=data, title=s.title||'منحة دراسية';
   document.title=title+' | تفاصيل المنحة وشروط التقديم | TeachGrant';
   const desc=String(s.description||s.requirements||'تفاصيل وشروط التقديم للمنحة الدراسية عبر TeachGrant.').replace(/\s+/g,' ').slice(0,155);
   document.querySelector('meta[name="description"]').content=desc;
   document.querySelector('meta[property="og:title"]').content=title+' | TeachGrant';
   document.querySelector('meta[property="og:description"]').content=desc;
   const canonical=location.origin+location.pathname+'?id='+encodeURIComponent(s.id);
   document.querySelector('link[rel="canonical"]').href=canonical;
   document.querySelector('meta[property="og:url"]').content=canonical;
   addBreadcrumbs(title,canonical);
   const apply=safeUrl(s.apply_link||s.link);
   root.innerHTML='<span class="tag">منحة دراسية</span><h1>'+esc(title)+'</h1><div class="org">'+esc(s.company||'الجهة المانحة غير محددة')+'</div>'+
    '<div class="facts"><div class="fact"><b>الدولة</b><span>'+esc(s.location||'غير محددة')+'</span></div><div class="fact"><b>المرحلة الدراسية</b><span>'+esc(({high_school:'الثانوية العامة',vocational:'التعليم المهني',bachelor:'بكالوريوس',masters:'ماجستير',phd:'دكتوراه',other:'زمالة / أخرى'})[s.study_level]||s.type||'غير محددة')+'</span></div><div class="fact"><b>نوع التمويل</b><span>'+esc(({fully_funded:'ممولة بالكامل',partially_funded:'ممولة جزئيًا',tuition_only:'تغطية الرسوم الدراسية',unfunded:'بدون تمويل',unknown:'تفاصيل التمويل وفق الإعلان'})[s.funding_type]||s.funding||'راجع التفاصيل')+'</span></div><div class="fact"><b>حالة التقديم</b><span>'+esc(s.status==='closed'||(s.deadline&&new Date(String(s.deadline).slice(0,10)+'T00:00:00')<new Date(new Date().setHours(0,0,0,0)))?'مغلقة':s.status==='upcoming'?'قريبًا':'مفتوحة الآن')+'</span></div><div class="fact"><b>آخر موعد للتقديم</b><span>'+esc(s.deadline||'راجع الموقع الرسمي')+'</span></div></div>'+
     (Array.isArray(s.eligible_countries)&&s.eligible_countries.length?'<h2>الدول والجنسيات المؤهلة</h2><div class="copy">'+esc(s.eligible_countries.join('، '))+'</div>')+
    '<h2>نبذة عن المنحة</h2><div class="copy">'+esc(s.description||'لم تتم إضافة وصف تفصيلي لهذه المنحة بعد.')+'</div>'+
    '<h2>شروط ومتطلبات التقديم</h2><div class="copy">'+esc(s.requirements||'يرجى مراجعة شروط القبول المنشورة لدى الجهة المانحة.')+'</div>'+
    '<div class="tg-page-ad" aria-label="مساحة إعلانية"><span class="tg-page-ad-label">إعلان</span><div class="tg-page-ad-slot" id="tg-page-ad-slot"></div></div>'+
    (apply?'<a class="apply" href="'+esc(apply)+'" target="_blank" rel="noopener noreferrer">التقديم عبر الموقع الرسمي ↗</a>':'<p class="muted">لم يتم إضافة رابط التقديم بعد.</p>');
   loadRelatedScholarships(s.id);
   (function(){
     if(sessionStorage.getItem('tb_admin_mode')==='1')return;
     var slot=document.getElementById('tg-page-ad-slot');
     if(!slot||slot.dataset.loaded==='1')return;
     slot.dataset.loaded='1';
     window.atOptions={key:'78266c4832fe41249a5bd02e3f9ee8cd',format:'iframe',height:250,width:300,params:{}};
     var adScript=document.createElement('script');
     adScript.setAttribute('data-cfasync','false');
     adScript.src='https://bauval.org/22/78266c4832fe41249a5bd02e3f9ee8cd';
     slot.appendChild(adScript);
   })();
   addJsonLd({'@context':'https://schema.org','@type':'WebPage','name':title,'description':desc,'url':canonical,'inLanguage':'ar','isPartOf':{'@type':'WebSite','name':'TeachGrant','url':'https://teachgrant.tech/'}});
 });
})();
</script>


</body>
</html>
