<script>
(function(){
 const SUPABASE_URL='https://dutpuwqybdzhjbiwrvcc.supabase.co';
 const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1dHB1d3F5YmR6aGpiaXdydmNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODU3MjYsImV4cCI6MjEwODE2MTcyNn0.tePW-I7gioA6O-0SSu0nohl7vUBS8N1vIq-F9R3HLcw';
 const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 const root=document.getElementById('content');
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const safeUrl=v=>{try{const u=new URL(String(v||''));return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return ''}};
 function cleanRichText(value){
   const template=document.createElement('template');template.innerHTML=String(value||'');
   const allowed=new Set(['P','BR','STRONG','B','EM','I','U','UL','OL','LI','H2','H3','H4','BLOCKQUOTE','A','SPAN','DIV']);
   const forbidden=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','FORM','INPUT','BUTTON','SVG','MATH']);
   function clean(parent){Array.from(parent.childNodes).forEach(node=>{
     if(node.nodeType===Node.TEXT_NODE)return;
     if(node.nodeType!==Node.ELEMENT_NODE){node.remove();return}
     if(forbidden.has(node.tagName)){node.remove();return}
     clean(node);
     if(!allowed.has(node.tagName)){node.replaceWith(...Array.from(node.childNodes));return}
     const href=node.tagName==='A'?node.getAttribute('href'):null;
     Array.from(node.attributes).forEach(a=>node.removeAttribute(a.name));
     if(node.tagName==='A'){const url=safeUrl(href);if(url){node.setAttribute('href',url);node.setAttribute('target','_blank');node.setAttribute('rel','noopener noreferrer')}}
   })}
   clean(template.content);return template.innerHTML;
 }
 const params=new URLSearchParams(window.location.search),rawId=params.get('id'),id=Number(rawId);
 if(!rawId||!Number.isFinite(id)||id<=0){
   root.innerHTML='<div class="muted"><strong>تعذر قراءة رقم الوظيفة من الرابط.</strong><br>الرابط: <code>'+esc(window.location.href)+'</code><br><a href="/#jobs">العودة إلى قائمة الوظائف</a></div>';return;
 }
 client.from('jobs').select('*').eq('id',id).maybeSingle().then(({data,error})=>{
   if(error){console.error('TeachGrant job query failed:',error);root.innerHTML='<div class="muted"><strong>تعذر تحميل بيانات الوظيفة.</strong><br>رمز الخطأ: '+esc(error.code||'غير معروف')+'<br>التفاصيل: '+esc(error.message||'لم تصل تفاصيل الخطأ')+'<br><a href="/#jobs">العودة إلى قائمة الوظائف</a></div>';return}
   if(!data){root.innerHTML='<div class="muted">لم يتم العثور على وظيفة بهذا الرقم ('+esc(id)+'). <a href="/#jobs">العودة إلى قائمة الوظائف</a></div>';return}
   const j=data,title=j.title||'وظيفة تعليمية';
   const marker=String(j.description||'').match(/<!--TG_JOB_META:([A-Za-z0-9+/=]+)-->/);
   let meta={};if(marker){try{meta=JSON.parse(decodeURIComponent(escape(atob(marker[1]))))}catch(e){}}
   const description=String(j.description||'').replace(/<!--TG_JOB_META:[A-Za-z0-9+/=]+-->/g,'').trim();
   document.title=title+' | الشروط وطريقة التقديم | TeachGrant';
   const plain=String(description.replace(/<[^>]*>/g,' ').replace(/\s+/g,' '));
   const desc=plain.slice(0,155)||('وظيفة لدى '+(j.company||'جهة العمل')+' عبر TeachGrant.');
   document.querySelector('meta[name="description"]').content=desc;
   document.querySelector('meta[property="og:title"]').content=title+' | TeachGrant';
   document.querySelector('meta[property="og:description"]').content=desc;
   const canonical=location.origin+location.pathname+'?id='+encodeURIComponent(j.id);
   document.querySelector('link[rel="canonical"]').href=canonical;
   document.querySelector('meta[property="og:url"]').content=canonical;
   const apply=safeUrl(j.apply_link),source=safeUrl(meta.source);
   root.innerHTML='<span class="tag">وظيفة تعليمية</span><h1>'+esc(title)+'</h1><div class="org">'+esc(j.company||'جهة العمل غير محددة')+'</div>'+
    '<div class="facts"><div class="fact"><b>الدولة</b><span>'+esc(j.location||'غير محددة')+'</span></div><div class="fact"><b>المدينة</b><span>'+esc(meta.city||'غير محددة')+'</span></div><div class="fact"><b>التخصص</b><span>'+esc(meta.specialty||'غير محدد')+'</span></div><div class="fact"><b>نوع الوظيفة</b><span>'+esc(j.type||'غير محدد')+'</span></div><div class="fact"><b>آخر موعد للتقديم</b><span>'+esc(j.deadline||'راجع جهة العمل')+'</span></div></div>'+
    '<h2>وصف الوظيفة</h2><div class="copy">'+(cleanRichText(description)||'لم تتم إضافة وصف تفصيلي لهذه الوظيفة بعد.')+'</div>'+
    '<h2>المؤهلات والمتطلبات</h2><div class="copy">'+(cleanRichText(j.requirements)||'يرجى مراجعة شروط جهة العمل عبر رابط التقديم الرسمي.')+'</div>'+
    (source?'<a class="source" href="'+esc(source)+'" target="_blank" rel="noopener noreferrer">عرض المصدر الأصلي للإعلان ↗</a>':'')+
    '<div class="tg-page-ad" aria-label="مساحة إعلانية"><span class="tg-page-ad-label">إعلان</span><div class="tg-page-ad-slot" id="tg-page-ad-slot"></div></div>'+
    (apply?'<a class="apply" href="'+esc(apply)+'" target="_blank" rel="noopener noreferrer">التقديم عبر الموقع الرسمي ↗</a>':'<p class="muted">لم يتم إضافة رابط التقديم بعد.</p>');
   const schema={'@context':'https://schema.org','@type':'JobPosting','title':title,'description':description||desc,'hiringOrganization':{'@type':'Organization','name':j.company||'جهة العمل'},'jobLocation':{'@type':'Place','address':{'@type':'PostalAddress','addressLocality':meta.city||undefined,'addressCountry':j.location||undefined}},'url':canonical};
   if(j.deadline)schema.validThrough=j.deadline;
   if(j.created_at)schema.datePosted=String(j.created_at).slice(0,10);
   if(apply)schema.directApply=true;
   const ld=document.createElement('script');ld.type='application/ld+json';ld.textContent=JSON.stringify(schema);document.head.appendChild(ld);
 });
})();
</script>
